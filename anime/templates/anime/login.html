<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
    <h2>ログイン</h2>
    
    <!-- 認証エラーなどがあった場合のメッセージ表示 -->
    {% if form.errors %}
        <p style="color: red;">ユーザー名かパスワードが間違っています。</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ログイン</button>
    </form>
    
    <p>アカウントをお持ちでない方は<a href="{% url 'anime:signup' %}">こちらから新規登録</a></p>
</body>
</html>
